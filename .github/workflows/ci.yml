name: ci

on:
  push:
    branches: [main]
  pull_request:

# The token can read this repository and do nothing else; a job that needs more says so itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Not 18 or 20: both EOL, and node --test does not expand a quoted glob pattern on them the way
        # 21+ does, so "test/*.test.mjs" matches nothing rather than every test file.
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  homey:
    # Homey's own validator, at the level the App Store requires.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm install -g homey
      - run: homey app validate --level publish

  manifest:
    # The same check the registry runs on a pull request, so a mistake is found here first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: Five-More-Minutes-App/fmm-plugin-registry
          path: registry
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: registry
      - run: node registry/scripts/validate.mjs --manifest fmm-plugin.json
